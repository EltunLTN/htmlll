<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Commute AI — Simulyasiya</title>
<style>
:root{--bg:#070b16;--card:#0e1528;--line:#1f2b4a;--tx:#e8edff;--mut:#7f8db3;--walk:#4ade80;--bus:#fbbf24;--metro:#22d3ee;--taxi:#f472b6;--bad:#f87171;--acc:#8b5cf6}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,#1b1450 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#06314a 0,transparent 55%),var(--bg)}
.wrap{max-width:1280px;margin:auto;padding:24px 20px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:28px;letter-spacing:-.5px}h1 span{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);font-size:13px;margin-top:4px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}label b{color:var(--tx)}
select,input[type=range]{accent-color:var(--acc)}
select{background:#121b33;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{border:0;border-radius:12px;padding:11px 20px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 24px #6d4ff055;transition:.2s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:default;transform:none}
button.ghost{background:#141d36;box-shadow:none;border:1px solid var(--line)}
main{display:grid;grid-template-columns:1fr 360px;gap:18px}
@media(max-width:960px){main{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#111a31cc,#0b1223cc);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
.stage{position:relative;padding:8px}
svg{width:100%;height:auto;display:block}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);background:#3a1218;border:1px solid var(--bad);color:#fecaca;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.5s;z-index:2;box-shadow:0 0 30px #f8717155}
#toast.on{transform:translate(-50%,0)}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mut);padding:6px 0 10px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
aside{display:flex;flex-direction:column;gap:14px}
h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.st{margin-bottom:12px}.st div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--mut)}.st b{color:var(--tx);font-size:15px}
.bar{height:8px;border-radius:5px;background:#17213d;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .8s;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}
#pill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:#1a2442;color:var(--mut)}
#pill.run{background:#14325a;color:#7dd3fc}#pill.ok{background:#0f3a26;color:var(--walk)}#pill.bad{background:#3a1218;color:var(--bad)}
ol{list-style:none;display:flex;flex-direction:column;gap:7px;min-height:40px}
ol li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:9px 11px;border-radius:10px;background:#121b33;border-left:4px solid var(--c);opacity:.65;transition:.3s}
ol li.cur{opacity:1;background:#1a2547;box-shadow:0 0 18px #6366f144}ol li.done{opacity:.35;text-decoration:line-through}
ol li small{color:var(--mut)}
#log{height:210px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
#log p{padding:7px 10px;border-radius:8px;background:#101931;line-height:1.4;animation:in .4s}
#log p.ml{border-left:3px solid var(--metro)}#log p.ai{border-left:3px solid var(--acc)}#log p.act{border-left:3px solid var(--walk)}#log p.ev{border-left:3px solid var(--bad);background:#2a1119}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.edge{fill:none;stroke-width:3;stroke-linecap:round;opacity:.28;transition:.4s}
.edge.plan{opacity:1;stroke-width:5;stroke-dasharray:9 9;animation:march 1s linear infinite;filter:url(#glow)}
.edge.done{opacity:1;stroke-width:5;stroke-dasharray:none;filter:url(#glow)}
.edge.blocked{stroke:var(--bad)!important;stroke-dasharray:3 8;opacity:.6;animation:none;filter:none}
@keyframes march{to{stroke-dashoffset:-36}}
.lb{font-size:11px;fill:#cdd7f5;text-anchor:middle;paint-order:stroke;stroke:#080d1b;stroke-width:5px;stroke-linejoin:round}
.nd{fill:#0f1730;stroke:#3a4a7a;stroke-width:2}.nd.goal{stroke:var(--taxi);filter:url(#glow)}.nd.here{stroke:#fff}
.nm{font-size:12px;fill:var(--tx);text-anchor:middle;font-weight:600}.em{font-size:22px;text-anchor:middle;dominant-baseline:central}
.pulse{fill:none;stroke:#fff;stroke-width:2;animation:pl 1.5s ease-out infinite}
@keyframes pl{from{r:9;opacity:.9}to{r:30;opacity:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Smart Commute <span>AI</span></h1><p>ML proqnoz · DFS planlayıcı · Goal-based agent · Dinamik re-planning</p></div>
  <div class="ctl">
    <label>Strategiya<select id="strat"><option value="balanced">Balanced</option><option value="fastest">Fastest</option><option value="cheapest">Cheapest</option></select></label>
    <label>Büdcə: <b id="bv">10</b> AZN<input id="bud" type="range" min="3" max="15" value="10"></label>
    <label>Deadline: <b id="dv">70</b> dəq<input id="dead" type="range" min="40" max="120" step="5" value="70"></label>
    <button id="go">▶ Başlat</button><button id="rs" class="ghost">↺ Sıfırla</button>
  </div>
</header>
<main>
  <section class="card stage">
    <div id="toast"></div>
    <svg id="map" viewBox="0 0 800 460">
      <defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g id="edges"></g><g id="labels"></g><g id="nodes"></g>
      <g id="agent" transform="translate(90,230)"><circle class="pulse" r="9"/><circle r="9" fill="#fff" filter="url(#glow)"/><circle r="4" fill="#6366f1"/></g>
    </svg>
    <div class="legend"><span><i style="background:var(--walk)"></i>Piyada</span><span><i style="background:var(--bus)"></i>Avtobus</span><span><i style="background:var(--metro)"></i>Metro</span><span><i style="background:var(--taxi)"></i>Taksi</span><span><i style="background:var(--bad)"></i>Bağlı</span></div>
  </section>
  <aside>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">📊 Vəziyyət</h3><span id="pill">Hazır</span></div>
      <div class="st"><div><span>Vaxt (deadline <span id="dl">70</span> dəq)</span><b id="tv">0.0</b></div><div class="bar"><i id="tb"></i></div></div>
      <div class="st"><div><span>Pul (büdcə)</span><b id="mv">0.00 AZN</b></div><div class="bar"><i id="mb"></i></div></div>
      <div class="st" style="margin:0"><div style="margin:0"><span>Planlayıcının yoxladığı state</span><b id="ex">0</b></div></div>
    </div>
    <div class="card"><h3>📋 Seçilmiş plan</h3><ol id="plan"></ol></div>
    <div class="card"><h3>🧠 Agent log</h3><div id="log"></div></div>
  </aside>
</main>
</div>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',GOAL='University',START='Home';let DEADLINE=70;
const N={'Home':[90,230,'🏠'],'Bus Stop':[260,80,'🚏'],'Metro A':[270,380,'🚇'],'Metro B':[520,390,'🚇'],'University':[710,220,'🎓']};
const C={walk:'#4ade80',bus:'#fbbf24',metro:'#22d3ee',taxi:'#f472b6'},I={walk:'🚶',bus:'🚌',metro:'🚇',taxi:'🚕'};
const E=[['Home','Bus Stop','walk',5,0,0,0],['Home','Metro A','walk',15,0,0,0],['Home','University','taxi',25,12,0,0],['Bus Stop','Metro A','bus',10,.5,1,0],['Bus Stop','University','bus',45,.6,2,0],['Metro A','Metro B','metro',12,.5,0,0],['Metro A','University','taxi',15,8,1,0],['Metro B','University','walk',10,0,0,.1],['Metro B','University','taxi',4,3,1,-.1]]
 .map(([a,b,mode,min,cost,traffic,k])=>({a,b,mode,min,cost,traffic,k}));
E[2].lt=.62;E[3].lt=.3; // label üst-üstə düşməsin
const MULT=[1,1.25,1.6],DELAY={walk:0,bus:2,metro:0,taxi:4};
const pred=e=>Math.round((e.min*MULT[e.traffic]+DELAY[e.mode])*10)/10; // ML modelinin brauzer yaxınlaşması
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let loc,T,M,blocked,runId=0,explored,BUDGET,planEdges=[],rej=[];

function mk(tag,at,p){const el=document.createElementNS(NS,tag);for(const k in at)el.setAttribute(k,at[k]);(p||$('#map')).appendChild(el);return el}
function build(){
 E.forEach((e,i)=>{const[x1,y1]=N[e.a],[x2,y2]=N[e.b],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),cx=(x1+x2)/2-dy/L*e.k*L,cy=(y1+y2)/2+dx/L*e.k*L;
  e.el=mk('path',{d:`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`,class:'edge',stroke:C[e.mode]},$('#edges'));
  const p=e.el.getPointAtLength(e.el.getTotalLength()*(e.lt||.5));e.lb=mk('text',{x:p.x,y:p.y+4,class:'lb'},$('#labels'))});
 for(const n in N){const[x,y,em]=N[n],g=mk('g',{},$('#nodes'));
  mk('circle',{cx:x,cy:y,r:27,class:'nd'+(n===GOAL?' goal':''),id:'n-'+n.replace(' ','')},g);
  const t=mk('text',{x,y,class:'em'},g);t.textContent=em;const m=mk('text',{x,y:y+46,class:'nm'},g);m.textContent=n}
 $('#nodes').after($('#agent'));
}
function labels(){E.forEach(e=>{e.lb.textContent=(blocked.has(e.mode)?'✕ ':I[e.mode]+' ')+pred(e)+'′ · '+e.cost.toFixed(1)+'₼'})}
function log(t,c){const p=document.createElement('p');p.className=c;p.innerHTML=t;$('#log').append(p);$('#log').scrollTop=1e5}
function pill(t,c){if(c==='bad'||c==='ok')$('#go').disabled=false;const p=$('#pill');p.textContent=t;p.className=c||''}
function stats(){$('#tv').textContent=T.toFixed(1)+' dəq';$('#mv').textContent=M.toFixed(2)+' AZN';
 $('#tb').style.width=Math.min(100,T/DEADLINE*100)+'%';$('#mb').style.width=Math.min(100,M/BUDGET*100)+'%';$('#ex').textContent=explored}
const score=(t,c)=>{const s=$('#strat').value;return s==='fastest'?t:s==='cheapest'?c:t+5*c};

function adj(p){return E.filter(e=>e.a===p||e.b===p).map(e=>({e,to:e.a===p?e.b:e.a}))}
function plan(){ // DFS state-space search + ML proqnozları
 rej=[];let best=null,bs=Infinity;const st=[{p:loc,r:[],t:T,c:M}];
 while(st.length){const s=st.pop();explored++;
  if(s.p===GOAL){const sc=score(s.t-T,s.c-M);if(sc<bs){bs=sc;best=s.r}continue}
  for(const m of adj(s.p)){if(blocked.has(m.e.mode))continue;
   const t=s.t+pred(m.e),c=s.c+m.e.cost;
   if(t>DEADLINE||c>BUDGET){if(m.to===GOAL)rej.push([loc,...s.r.map(x=>x.to),m.to].join(' → ')+': '+(t>DEADLINE?`cəmi ${t.toFixed(1)} dəq > deadline ${DEADLINE}`:`cəmi ${c.toFixed(1)} AZN > büdcə ${BUDGET}`));continue}
   if(m.to===loc||s.r.some(x=>x.to===m.to))continue;
   st.push({p:m.to,r:[...s.r,m],t,c})}}
 return best?{route:best,score:bs}:null}

function why(){return rej.length?'<br><i>Rədd edilən yollar:</i><br>'+[...new Set(rej)].slice(0,5).map(x=>'• '+x).join('<br>'):''}
function showPlan(route,cur){
 E.forEach(e=>{e.el.classList.remove('plan');e.el.classList.toggle('blocked',blocked.has(e.mode))});
 route.forEach(m=>m.e.el.classList.add('plan'));
 let from=loc;$('#plan').innerHTML=route.map((m,i)=>{const h=`<li style="--c:${C[m.e.mode]}" class="${i===0?'cur':''}"><span>${I[m.e.mode]} ${from} → ${m.to}</span><small>${pred(m.e)}′ · ${m.e.cost.toFixed(1)}₼</small></li>`;from=m.to;return h}).join('');
}
function move(m){return new Promise(res=>{const e=m.e,L=e.el.getTotalLength(),fw=e.a===loc,t0=performance.now(),ag=$('#agent');
 const f=t=>{let p=Math.min(1,(t-t0)/1500);p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  const pt=e.el.getPointAtLength(L*(fw?p:1-p));ag.setAttribute('transform',`translate(${pt.x},${pt.y})`);p<1?requestAnimationFrame(f):res()};
 requestAnimationFrame(f)})}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),3500)}
function here(){document.querySelectorAll('.nd').forEach(n=>n.classList.remove('here'));$('#n-'+loc.replace(' ','')).classList.add('here')}

function reset(){runId++;loc=START;T=0;M=0;blocked=new Set();explored=0;BUDGET=+$('#bud').value;DEADLINE=+$('#dead').value;$('#dl').textContent=DEADLINE;
 E.forEach(e=>e.el.setAttribute('class','edge'));labels();$('#agent').setAttribute('transform','translate(90,230)');
 $('#plan').innerHTML='';$('#log').innerHTML='';pill('Hazır');stats();here();$('#go').disabled=false}

async function run(){
 reset();const id=runId;$('#go').disabled=true;pill('İşləyir','run');
 log(`🎯 <b>Məqsəd:</b> ${GOAL} · deadline ${DEADLINE} dəq · büdcə ${BUDGET} AZN · strategiya <b>${$('#strat').value}</b>`,'ai');
 log('🔎 <b>Planlayıcı</b> mümkün gələcək state-ləri axtarır...','ai');await sleep(900);
 let P=plan();stats();
 if(!P){log('❌ Etibarlı marşrut yoxdur.','ev');pill('Uğursuz','bad');return}
 log(`✓ Plan tapıldı, score <b>${P.score.toFixed(1)}</b> (ML proqnozlarına əsasən)`+why(),'ml');showPlan(P.route);await sleep(1200);
 while(loc!==GOAL){
  if(id!==runId)return;
  if(!P||!P.route.length){P=plan();stats();if(!P){log('❌ Missiya uğursuz oldu.','ev');pill('Uğursuz','bad');return}showPlan(P.route)}
  const m=P.route.shift();
  log(`🤖 <b>Action:</b> ${loc} → ${m.to} (${I[m.e.mode]} ${m.e.mode}) · ML: ${pred(m.e)} dəq`,'act');
  await move(m);if(id!==runId)return;
  m.e.el.classList.remove('plan');m.e.el.classList.add('done');
  loc=m.to;T+=pred(m.e);M+=m.e.cost;stats();here();
  const li=$('#plan li.cur');if(li){li.className='done';if(li.nextElementSibling)li.nextElementSibling.className='cur'}
  if(loc==='Metro A'&&loc!==GOAL){
   await sleep(500);blocked.add('metro');labels();toast('🚨 METRO bağlandı!');
   log('🚨 <b>Mühit dəyişdi:</b> METRO əlçatmaz oldu!','ev');await sleep(900);
   log('🔄 <b>Re-planning:</b> agent yeni marşrut axtarır...','ai');pill('Re-planning','run');await sleep(1000);
   P=plan();stats();
   if(!P){log('❌ Yeni marşrut yoxdur. Büdcəni və ya deadline-ı artırıb yenidən cəhd et.'+why(),'ev');pill('Uğursuz','bad');showPlan([]);return}
   log(`✓ Yeni plan tapıldı, score <b>${P.score.toFixed(1)}</b>`+why(),'ml');showPlan(P.route);pill('İşləyir','run');await sleep(1000)}
 }
 log(`🎉 <b>Məqsədə çatıldı!</b> Vaxt ${T.toFixed(1)} dəq · Pul ${M.toFixed(2)} AZN`,'act');pill('Çatdı ✓','ok');$('#go').disabled=false;
}
$('#bud').oninput=e=>{$('#bv').textContent=e.target.value;if(!$('#go').disabled)reset()};
$('#dead').oninput=e=>{$('#dv').textContent=e.target.value;if(!$('#go').disabled)reset()};
$('#go').onclick=run;$('#rs').onclick=reset;
build();reset();
</script>
</body>
</html>
